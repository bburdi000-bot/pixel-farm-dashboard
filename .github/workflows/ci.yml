name: ci
# Four gates, no dependencies, no build step. The whole point of authoring art
# as row strings in source is that `node` alone can verify it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. SYNTAX. A broken .js in a no-build project ships a blank page, and
      #    nothing else here would catch it.
      - name: node --check every source file
        run: |
          set -e
          found=0
          for f in src/*.js tools/*.js; do
            node --check "$f" && echo "  ok    $f"
            found=$((found+1))
          done
          test "$found" -gt 0 || { echo "no .js files found"; exit 1; }
          echo "$found file(s) parse"

      # 2. ART METRICS. Measures the authored rows read straight out of
      #    src/engine.js and src/sprites.js: interior detail >= 12%,
      #    clustering >= 50%, luminance span <= 8, and the alert axis keeping
      #    >= 15 dY over every ground surface.
      - name: art metrics
        run: node tools/artcheck.js

      # 3. FIXTURE INTEGRITY. Re-derives the committed demo model and diffs it.
      #    This is the privacy gate: the generator refuses to emit any real
      #    identifier, and --check proves the committed JSON is its output and
      #    was not hand-edited to slip something in.
      - name: demo fixtures match their generator
        run: node tools/make-demo.js --check

      # 4. BEHAVIOUR. The motion contract and a real headless render.
      - name: motion contract
        run: |
          node tools/verify-commute.js data/farm-demo.json
          node tools/verify-commute.js data/farm-demo-nomap.json
      - name: headless render smoke
        run: node tools/render-smoke.js

      # 5. NO REAL DATA. Three independent controls, because the allow-list in
      #    make-demo.js only catches strings that reach the output WITHOUT being
      #    declared. It cannot catch a real name typed into a declared table --
      #    that is what 5b and 5c are for.
      - name: no live model in the tree
        run: |
          set -e
          # 5a. the live model must never be tracked
          if git ls-files | grep -E '(^|/)farm-model.*\.json$'; then
            echo "FAIL: a live model is tracked"; exit 1; fi
          # 5b. the generator must be incapable of reaching real state. It may
          #     only touch data/. No home directory, no env, no child process,
          #     no network -- so "regenerate the fixtures" can never read a disk
          #     it should not. This is checkable in public without naming
          #     anything private.
          if grep -nE "homedir|process\.env|child_process|require\(.(http|https|net|dns)\.\)|fetch\(" tools/make-demo.js; then
            echo "FAIL: the generator can reach outside data/"; exit 1; fi
          if grep -nE "readFileSync|writeFileSync" tools/make-demo.js | grep -vE "path\.join\(OUT|\bfp\b"; then
            echo "FAIL: the generator does file I/O outside OUT"; exit 1; fi
          # 5c. the public brand strings are the only real identifiers safe to
          #     name in a public gate; they must not appear outside the README
          #     link and this file.
          if git grep -nIE 'marginsignal|bburdi' -- . ':!.github/workflows/ci.yml' ':!README.md'; then
            echo "FAIL: a brand identifier appears in the tree"; exit 1; fi
          echo "  ok    no live model; generator is sandboxed to data/; no brand strings"

      # 5. ART ROUND TRIP. The PNG bridge that lets tiles be edited in a pixel
      #    editor must be lossless, or art silently changes shape in transit.
      - name: pixedit round trip
        run: node tools/pixedit.js verify
